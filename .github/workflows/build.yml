name: Build

on:
  push:
    # Tag pushes are covered by the release workflow, which builds the same
    # commit. Without this filter every tag rebuilt what main had already built.
    branches:
      - main
  pull_request:

# Only reading the repository, so the default write-scoped token is more than
# this job has any use for.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are worth canceling. A run on main is not,
  # since it is the record of whether that commit builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test:coverage
      - name: Check coverage
        run: bun run coverage:check
      - name: Build
        run: bun run build

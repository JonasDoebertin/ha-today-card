name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Creating the release needs write access. Nothing else here does.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole tag list has to be present for the previous stable tag
          # to be findable. The default shallow fetch does not include it.
          fetch-depth: 0
      - name: Inject version number
        run: |
          sed -i "s/v0\.0\.0/${GITHUB_REF_NAME}/" src/const.ts
          # A silent miss would ship a bundle telling every user it is v0.0.0,
          # so confirm the placeholder was actually there.
          grep -q "\"${GITHUB_REF_NAME}\"" src/const.ts \
            || { echo "::error::version placeholder not found in src/const.ts"; exit 1; }
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      # A tag that cannot pass its own tests has no business producing a
      # bundle that HACS will hand to every user.
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Find the previous stable tag
        id: previous
        run: |
          echo "tag=$(git tag -l 'v*' --sort=-v:refname \
            | grep -v -e '-' \
            | grep -v -e "^${GITHUB_REF_NAME}$" \
            | head -1)" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          # Left to itself GitHub picks the baseline for the generated notes
          # with an undocumented heuristic that has changed over time. Naming
          # the last stable tag keeps a prerelease from swallowing the changes
          # that belong in the release which follows it.
          previous_tag: ${{ steps.previous.outputs.tag }}
          # The action does not read prerelease status from the tag, so a
          # v1.2.0-beta.1 draft would otherwise publish as the latest stable
          # release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.js

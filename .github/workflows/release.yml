name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Read by default; the release job alone gets write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      previous_tag: ${{ steps.previous.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole tag list has to be present for the previous stable tag
          # to be findable. The default shallow fetch does not include it.
          fetch-depth: 0
          persist-credentials: false
      - name: Inject version number
        run: |
          sed -i "s/v0\.0\.0/${GITHUB_REF_NAME}/" src/const.ts
          # A silent miss would ship a bundle telling every user it is v0.0.0,
          # so confirm the placeholder was actually there.
          grep -q "\"${GITHUB_REF_NAME}\"" src/const.ts \
            || { echo "::error::version placeholder not found in src/const.ts"; exit 1; }
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      # A tag that cannot pass its own tests has no business producing a
      # bundle that HACS will hand to every user.
      - name: Test
        run: bun run test:coverage
      - name: Check coverage
        run: bun run coverage:check
      - name: Build
        run: bun run build
      - name: Find the previous stable tag
        id: previous
        run: |
          echo "tag=$(git tag -l 'v*' --sort=-v:refname \
            | grep -v -e '-' \
            | grep -v -e "^${GITHUB_REF_NAME}$" \
            | head -1)" >> "$GITHUB_OUTPUT"
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*.js
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          # Left to itself GitHub picks the baseline for the generated notes
          # with an undocumented heuristic that has changed over time. Naming
          # the last stable tag keeps a prerelease from swallowing the changes
          # that belong in the release which follows it.
          previous_tag: ${{ needs.build.outputs.previous_tag }}
          # The action does not read prerelease status from the tag, so a
          # v1.2.0-beta.1 draft would otherwise publish as the latest stable
          # release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.js

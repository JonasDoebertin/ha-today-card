name: HACS Validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hacs-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # hacs/action validates the head repository, which for a pull request from
    # a fork is the contributor's copy rather than this one. A fork is never a
    # published HACS repository, so the job can only ever fail there.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: HACS Validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: plugin
